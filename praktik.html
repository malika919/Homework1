<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <button class="btn">нажать</button>
    </div>
    <p class="color__text">Цвет текста</p>
    <button class="color__btn">изменить цвет</button>
    <ul>
        <li class="description">hii</li>
        <li class="description">hii</li>
        <li class="description">hii</li>
    </ul>
    <p class="text">Lorem, ipsum dolor.</p>
    <p class="description">Lorem, ipsum dolor.</p>
    <p class="description">Lorem, ipsum dolor.</p>
    <p class="text">Lorem, ipsum dolor.</p>
    <p class="description">Lorem, ipsum dolor.</p>
    <button class="btn__remove">Удалить первый вбзац</button><br>
    <button class="btn__new">Нажми на кнопку</button>
</body>
<script>
    const btnEl = document.querySelector('.btn') //1 задание

    btnEl.addEventListener('click', () => {
        const containerEl = document.querySelector('.container')
        const removeEl = containerEl.querySelector('.creat')
        if (removeEl) {
            removeEl.remove()
        } else {
            const creatEl = document.createElement('h1')
            creatEl.textContent = 'привет';
            creatEl.classList.add('creat')
            containerEl.appendChild(creatEl)
        }
    })


    const btnColorEl = document.querySelector('.color__btn')
    const textColorEl = document.querySelector('.color__text');


    btnColorEl.addEventListener('click', () => {
        textColorEl.style.color = 'blue'; // 2 задание
        textColorEl.textContent = 'Привет, мир!' // 3 задание
    })

    const descriptionTextEl = document.querySelectorAll('.description') //4 задание

    descriptionTextEl.forEach(description => {
        description.textContent = 'Измененный текст'
    });

    const descriptionTextPageEl = document.querySelectorAll('p.description'); //5 задание 

    descriptionTextPageEl.forEach((description) => {
        description.textContent = 'Новый тест'
    })

    const btnNewEl = document.querySelector('.btn__new'); //6 задание

    btnNewEl.addEventListener('click', () => {
        const removeCreaTextPageEl = document.querySelector('.new__page')
        if (removeCreaTextPageEl) {
            removeCreaTextPageEl.remove()
        } else {
            const creaTextPageEl = document.createElement('p')
            creaTextPageEl.textContent = 'Новый абзац'
            creaTextPageEl.classList.add('new__page')
            document.body.appendChild(creaTextPageEl)
        }
    })

    const removeDescriptionText = document.querySelector('.btn__remove') //7 задание 
    const removeFirstEl = document.querySelector('.description')

    removeDescriptionText.addEventListener('click', () => {
        removeFirstEl.remove()
    })
</script>

</html>
